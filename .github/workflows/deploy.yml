name: Deploy to AWS

on:
  push:
    branches: [ main ]

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: backend-portfolio

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2

    - name: Set up JDK 17
      uses: actions/setup-java@v2
      with:
        java-version: '17'
        distribution: 'adopt'

    - name: Build with Gradle
      run: |
        chmod +x ./gradlew
        ./gradlew build -x test

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build and push Docker image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}

    - name: Deploy to EC2 using SSM
      run: |
        COMPOSE_B64=$(base64 -w 0 docker-compose.monitoring.yml)
        PROMETHEUS_B64=$(base64 -w 0 prometheus.prod.yml)
        REGISTRY="${{ steps.login-ecr.outputs.registry }}"
        IMAGE="${REGISTRY}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"

        # jq로 JSON 안전하게 구성 (이스케이핑 오류 없음)
        PARAMS=$(jq -n \
          --arg compose   "$COMPOSE_B64" \
          --arg prom      "$PROMETHEUS_B64" \
          --arg registry  "$REGISTRY" \
          --arg image     "$IMAGE" \
          --arg rds_host  "${{ secrets.RDS_ENDPOINT }}" \
          --arg rds_pass  "${{ secrets.RDS_PASSWORD }}" \
          '{commands: [
            "mkdir -p /home/ubuntu/monitoring",
            ("echo " + $compose + " | base64 -d > /home/ubuntu/monitoring/docker-compose.monitoring.yml"),
            ("echo " + $prom    + " | base64 -d > /home/ubuntu/monitoring/prometheus.prod.yml"),
            ("aws ecr get-login-password --region ap-northeast-2 | docker login --username AWS --password-stdin " + $registry),
            "cd /home/ubuntu/monitoring && docker compose -f docker-compose.monitoring.yml pull",
            "cd /home/ubuntu/monitoring && docker compose -f docker-compose.monitoring.yml up -d",
            "docker stop portfolio-app || true",
            "docker rm portfolio-app || true",
            ("docker run -d --name portfolio-app --network monitoring -p 8080:8080 -e SPRING_PROFILES_ACTIVE=prod -e JAVA_OPTS=-Xmx256m -e RDS_ENDPOINT=" + $rds_host + " -e RDS_PASSWORD=" + $rds_pass + " " + $image)
          ]}')

        aws ssm send-command \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --document-name "AWS-RunShellScript" \
          --parameters "$PARAMS"
