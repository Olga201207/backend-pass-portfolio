spring:
  datasource:
    url: jdbc:mysql://${RDS_ENDPOINT:localhost}:3307/portfolio?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&useSSL=false&rewriteBatchedStatements=true
    username: portfolio_user
    password: ${RDS_PASSWORD:portfolio1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 64
    # db connection pool = thread pool * 2
    # transaction -> transaction(Propagation.REQUIRES_NEW) : 2개의 db connection 필요
    # thread -> 2개의 db connection pool 사용

    # 1-A transaction: named lock을 위한 transaction => named lock 풀
    # (더 중요) 1-B transaction: db update를 위한 transaction => 일반 트랜잭션 풀

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
        session_factory:
          statement_inspector: ding.co.backendportfolio.chapter5.config.QueryCountInspector
    database-platform: org.hibernate.dialect.MySQL8Dialect
  data:
    redis:
      host: localhost
      port: 6379

